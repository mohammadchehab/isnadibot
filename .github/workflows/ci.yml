# CI validates pull requests before they reach main, and main after each merge.
# Heavy jobs (desktop, server shards) run on the self-hosted `hetzner` runners for the repository's own
# branches, and on GitHub-hosted runners for pull requests from forks, so fork code never runs on our box.
# Independent jobs run in parallel; the last job, "Repository checks", is the single required status.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact version-branch revision to validate
        required: true
        type: string
      expected_pr_number:
        description: Repository-owned Changesets pull request to validate
        required: true
        type: string

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy_runner: ${{ steps.runner.outputs.heavy_runner }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Docs-only pull requests skip the build and test jobs. Renames count both paths. Pushes to main and dispatches always run everything.
      - name: Detect code changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if test "$EVENT_NAME" != pull_request; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          test -n "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|\.changeset/|\.github/assets/|[^/]+\.md$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the runner for heavy jobs
        id: runner
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then echo "heavy_runner=ubuntu-24.04"; else echo "heavy_runner=hetzner"; fi >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Authorize version-branch dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.expected_pr_number }}
        run: |
          test -n "$EXPECTED_SHA"
          test -n "$PR_NUMBER"
          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
          author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')"
          test "$head_ref" = changeset-release/main
          test "$head_sha" = "$EXPECTED_SHA"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$author" = 'github-actions[bot]'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Install workspace
        uses: ./.github/actions/install

      - name: Protect stable release versions
        # The owner labels a PR release-version-reset to move versions on purpose (first release).
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !contains(github.event.pull_request.labels.*.name, 'release-version-reset') &&
              !(github.head_ref == 'changeset-release/main' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.user.login == 'github-actions[bot]') }}
        run: |
          changed=false
          for manifest in apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json; do
            base_version="$(git show "origin/main:$manifest" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => console.log(JSON.parse(data).version))")"
            head_version="$(node -p "require('./$manifest').version")"
            if test "$base_version" != "$head_version"; then
              printf '%s changes the stable version from %s to %s. Only the repository-owned Changesets version PR may change release versions.\n' "$manifest" "$base_version" "$head_version" >&2
              changed=true
            fi
          done
          test "$changed" = false

      - name: Require a changeset decision
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !(github.head_ref == 'changeset-release/main' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.user.login == 'github-actions[bot]') }}
        run: |
          changeset_files="$(git diff --name-only --diff-filter=A origin/main...HEAD -- '.changeset/*.md' ':!.changeset/README.md')"
          if test -z "$changeset_files"; then
            printf 'Add a release changeset with `pnpm changeset` or an explicit empty marker with `pnpm changeset --empty`.\n' >&2
            exit 1
          fi
          vp exec changeset status --since=origin/main

      - name: Ensure Electron runtime is installed
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: vp run --filter @isnadi/desktop ensure:electron

      - name: Validate plugin catalog
        run: node scripts/validate-plugin-catalog.ts

      - name: Test plugin catalog and contribution policy
        run: >-
          vp test run
          scripts/validate-plugin-catalog.test.ts
          scripts/plugin-contribution-policy.test.ts
          plugins/catalog.test.ts
          plugins/schema.test.ts
          plugins/lifecycle-matrix.test.ts

      - name: Lint
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: vp run lint

      - name: Check formatting
        run: vp run fmt:check

      - name: Typecheck
        if: ${{ needs.changes.outputs.code == 'true' }}
        run: vp run typecheck

  desktop:
    name: Desktop build and package tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ needs.changes.outputs.heavy_runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Install workspace
        uses: ./.github/actions/install

      - name: Ensure Electron runtime is installed
        run: vp run --filter @isnadi/desktop ensure:electron

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          # Electron runs a sandboxed preload inside a function with these parameters; a bundle
          # that redeclares one of them (such as setImmediate) never loads.
          node -e '
            const fs = require("node:fs");
            for (const name of ["preload.cjs", "preview-pip-preload.cjs"]) {
              const source = fs.readFileSync(`apps/desktop/dist-electron/${name}`, "utf8");
              new Function("exports", "require", "module", "__filename", "__dirname", "process", "Buffer", "global", "setImmediate", "clearImmediate", source);
              console.log(`${name} parses as a sandboxed preload`);
            }
          '

      - name: Test shipped desktop and shared packages
        env:
          # Each package's vitest otherwise starts its own default worker pool. 4 packages x 2 workers keeps the step near 8.
          VITEST_MAX_WORKERS: "2"
        run: vp run --parallel --concurrency-limit 4 --filter '!isnadibot' --filter '!@isnadi/monorepo' --filter '!@isnadi/mobile' test

      - name: Exercise release-only configuration
        run: vp run release:smoke

  server:
    name: Server tests (shard ${{ matrix.shard }}/4)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ needs.changes.outputs.heavy_runner }}
    timeout-minutes: 45
    # Files inside a shard still run one at a time; the suite is not safe to parallelize in one process.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Install workspace
        uses: ./.github/actions/install

      - name: Ensure Electron runtime is installed
        run: vp run --filter @isnadi/desktop ensure:electron

      # The browser tests need a real Chromium. Only the Hetzner box has one, so the step is
      # self-hosted only and the tests skip on a fork pull request's GitHub-hosted runner. All
      # four shards run it: the install is a no-op after the first one, and any shard may be the
      # one that holds the browser test file.
      - name: Provide Chromium
        if: runner.environment == 'self-hosted'
        run: |
          binary="$(scripts/ci/install-chromium.sh /opt/chrome-for-testing)"
          "${binary}" --version
          echo "ISNADI_CHROMIUM_PATH=${binary}" >> "$GITHUB_ENV"

      - name: Test isolated server suite
        run: >-
          vp run --filter isnadibot test
          --exclude integration/orchestrationEngine.integration.test.ts
          --shard=${{ matrix.shard }}/4

  native:
    name: Resource monitor
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  # The only job the repository ruleset requires. It stays green when docs-only pull requests skip the
  # heavy jobs, and fails when any job fails, is cancelled, or is skipped when it should have run.
  check:
    name: Repository checks
    needs: [changes, static, desktop, server, native]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have run as expected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          code="$(printf '%s' "$NEEDS" | jq -r '.changes.outputs.code')"
          expected_heavy=skipped
          test "$code" = true && expected_heavy=success
          status=0
          check() {
            actual="$(printf '%s' "$NEEDS" | jq -r ".\"$1\".result")"
            if test "$actual" != "$2"; then
              printf '%s: expected %s, got %s\n' "$1" "$2" "$actual" >&2
              status=1
            fi
          }
          check changes success
          check static success
          check desktop "$expected_heavy"
          check server "$expected_heavy"
          check native "$expected_heavy"
          exit "$status"
